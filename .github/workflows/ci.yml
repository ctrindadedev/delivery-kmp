name: CI

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.toml', '**/*.kts') }}
          restore-keys: gradle-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/catalogo/go.mod
          cache: false # sem go.sum ainda

      - name: Permissão do wrapper
        run: chmod +x ./gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Análise estática (detekt)
        run: ./gradlew detekt :shared:detektMetadataMain --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Testes do domínio
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Aplicativo Android e desktop
        run: ./gradlew :app:assembleDebug :app:packageUberJarForCurrentOS --no-daemon

      - name: Publicar aplicativo Android
        uses: actions/upload-artifact@v4
        with:
          name: delivery-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar aplicativo desktop
        uses: actions/upload-artifact@v4
        with:
          name: delivery-desktop-linux
          path: app/build/compose/jars/*.jar
          if-no-files-found: error

      - name: Build do serviço Go (catalogo)
        working-directory: services/catalogo
        run: go build ./...

      - name: Testes do serviço Go (catalogo)
        working-directory: services/catalogo
        run: go test ./...
