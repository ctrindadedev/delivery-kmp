name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.toml', '**/*.kts') }}
          restore-keys: gradle-

      - name: Permissão do wrapper
        run: chmod +x ./gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Análise estática (detekt)
        run: ./gradlew detekt :shared:detektMetadataMain --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Testes do domínio
        run: ./gradlew :shared:jvmTest --no-daemon
