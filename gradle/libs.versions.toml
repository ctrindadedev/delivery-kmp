[versions]
kotlin          = "2.0.21"
ktor            = "3.0.3"
koin            = "4.0.0"
exposed         = "0.57.0"
logback         = "1.5.12"
postgres        = "42.7.4"
java            = "21"
compose         = "1.7.3"
agp             = "8.7.3"
activityCompose = "1.9.3"
ktlint-gradle   = "14.2.0"
detekt          = "1.23.8"
flyway          = "11.20.3"
hikaricp        = "6.3.3"
archunit        = "1.4.2"
testcontainers  = "2.0.5"
junit           = "5.11.4"
navigation      = "2.8.0-alpha10"
composeAdaptive = "1.0.0-alpha03"

[libraries]
ktor-server-core          = { module = "io.ktor:ktor-server-core",                version.ref = "ktor" }
ktor-server-netty         = { module = "io.ktor:ktor-server-netty",               version.ref = "ktor" }
ktor-server-content-neg   = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json   = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages  = { module = "io.ktor:ktor-server-status-pages",        version.ref = "ktor" }

ktor-server-test-host     = { module = "io.ktor:ktor-server-test-host",           version.ref = "ktor" }

koin-ktor                 = { module = "io.insert-koin:koin-ktor",                version.ref = "koin" }

exposed-core              = { module = "org.jetbrains.exposed:exposed-core",      version.ref = "exposed" }
exposed-dao               = { module = "org.jetbrains.exposed:exposed-dao",       version.ref = "exposed" }
exposed-jdbc              = { module = "org.jetbrains.exposed:exposed-jdbc",      version.ref = "exposed" }

flyway-core               = { module = "org.flywaydb:flyway-core",                version.ref = "flyway" }
flyway-postgresql         = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp                  = { module = "com.zaxxer:HikariCP",                     version.ref = "hikaricp" }

junit-bom                 = { module = "org.junit:junit-bom",                     version.ref = "junit" }
junit-jupiter             = { module = "org.junit.jupiter:junit-jupiter" }
archunit-junit5           = { module = "com.tngtech.archunit:archunit-junit5",    version.ref = "archunit" }
testcontainers-bom        = { module = "org.testcontainers:testcontainers-bom",   version.ref = "testcontainers" }
testcontainers-junit      = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

postgres                  = { module = "org.postgresql:postgresql",               version.ref = "postgres" }
logback                   = { module = "ch.qos.logback:logback-classic",          version.ref = "logback" }
navigation-compose        = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
material3-window-size     = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "compose" }
material3-adaptive        = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
androidx-activity-compose = { module = "androidx.activity:activity-compose",      version.ref = "activityCompose" }

[plugins]
kotlinMultiplatform       = { id = "org.jetbrains.kotlin.multiplatform",          version.ref = "kotlin" }
kotlinJvm                 = { id = "org.jetbrains.kotlin.jvm",                   version.ref = "kotlin" }
kotlinSerialization       = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
androidApplication        = { id = "com.android.application",                    version.ref = "agp" }
androidLibrary            = { id = "com.android.library",                        version.ref = "agp" }
composeMultiplatform      = { id = "org.jetbrains.compose",                      version.ref = "compose" }
composeCompiler           = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
ktlint                    = { id = "org.jlleitschuh.gradle.ktlint",              version.ref = "ktlint-gradle" }
detekt                    = { id = "io.gitlab.arturbosch.detekt",                version.ref = "detekt" }
